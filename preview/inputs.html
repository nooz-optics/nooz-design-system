<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;padding:24px;background:#FCFAFA;font-family:'Mont',sans-serif;display:flex;flex-direction:column;gap:12px}
  .f{display:flex;flex-direction:column;gap:4px}
  .lbl{font-size:11px;font-weight:500;color:#2D2D2D}
  .inp{padding:10px 12px;border:1px solid #CED4DA;background:#fff;font-family:inherit;font-size:13px;font-weight:300;color:#2D2D2D;border-radius:4px;outline:none}
  .inp:focus{border-color:#DC693B}
  .hint{font-size:10px;color:#8D8D8D}
  .row{display:flex;gap:10px}
  .row .f{flex:1}
</style></head><body>
<div class="row">
  <div class="f"><label class="lbl">Name</label><input class="inp" placeholder="First name & last name"></div>
  <div class="f"><label class="lbl">E-mail</label><input class="inp" placeholder="you@example.com"></div>
</div>
<div class="f"><label class="lbl">Diopter</label><select class="inp"><option>Without correction</option><option>+1.0</option><option>+1.5</option></select><span class="hint">Choose the one you currently use.</span></div>
</body></html>
