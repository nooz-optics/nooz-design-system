<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px;background:#FCFAFA;font-family:'Mont',sans-serif}
  .family{font-size:48px;font-weight:700;color:#2D2D2D;letter-spacing:-0.01em;line-height:1}
  .abc{font-size:18px;color:#585858;margin-top:8px;letter-spacing:0.02em}
  .weights{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
  .w{display:flex;flex-direction:column;gap:2px}
  .w .s{font-size:20px;color:#2D2D2D}
  .w .n{font-size:10px;color:#8D8D8D;letter-spacing:0.04em;text-transform:uppercase}
</style></head>
<body>
<div class="family">Mont</div>
<div class="abc">ABCDEFGHIJKLM · abcdefg · 0123456789</div>
<div class="weights">
  <div class="w"><div class="s" style="font-weight:100">Light</div><div class="n">100 / Light</div></div>
  <div class="w"><div class="s" style="font-weight:300">Regular</div><div class="n">300 / Regular</div></div>
  <div class="w"><div class="s" style="font-weight:500">Semibold</div><div class="n">500 / Semibold</div></div>
  <div class="w"><div class="s" style="font-weight:700">Bold</div><div class="n">700 / Bold</div></div>
</div>
</body></html>
