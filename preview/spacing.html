<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;padding:28px;background:#FCFAFA;font-family:'Mont',sans-serif;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:center;gap:14px}
  .bar{background:#DC693B;height:20px}
  .n{min-width:54px;font-size:10px;color:#8D8D8D;font-variant-numeric:tabular-nums}
  .u{font-size:11px;color:#2D2D2D}
</style></head><body>
<div class="row"><div class="n">8px</div><div class="bar" style="width:8px"></div><div class="u">xs · tight chips</div></div>
<div class="row"><div class="n">12px</div><div class="bar" style="width:12px"></div><div class="u">sm · form fields</div></div>
<div class="row"><div class="n">16px</div><div class="bar" style="width:16px"></div><div class="u">md · dominant gap</div></div>
<div class="row"><div class="n">20px</div><div class="bar" style="width:20px"></div><div class="u">lg · section inner</div></div>
<div class="row"><div class="n">28px</div><div class="bar" style="width:28px"></div><div class="u">xl · section heading mb</div></div>
<div class="row"><div class="n">60px</div><div class="bar" style="width:60px"></div><div class="u">2xl · major sections</div></div>
<div class="row"><div class="n">64px</div><div class="bar" style="width:64px"></div><div class="u">container pad desktop</div></div>
</body></html>
