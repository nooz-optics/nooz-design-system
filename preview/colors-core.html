<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#FCFAFA;display:flex;flex-direction:column;gap:18px}
  .swatch-row{display:flex;gap:10px;align-items:stretch}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .sw .chip{height:72px;border:1px solid rgba(0,0,0,0.06)}
  .sw .lbl{font-size:11px;font-weight:500;color:#2D2D2D;letter-spacing:0.02em}
  .sw .hex{font-size:10px;color:#8D8D8D;font-variant-numeric:tabular-nums}
</style></head>
<body>
<div class="swatch-row">
  <div class="sw"><div class="chip" style="background:#DC693B"></div><div class="lbl">Terracota</div><div class="hex">#DC693B · primary</div></div>
  <div class="sw"><div class="chip" style="background:#FCFAFA;border:1px solid #D1D1D1"></div><div class="lbl">Background</div><div class="hex">#FCFAFA · page bg</div></div>
  <div class="sw"><div class="chip" style="background:#2D2D2D"></div><div class="lbl">Title</div><div class="hex">#2D2D2D · headings</div></div>
  <div class="sw"><div class="chip" style="background:#585858"></div><div class="lbl">Text</div><div class="hex">#585858 · body</div></div>
  <div class="sw"><div class="chip" style="background:#000000"></div><div class="lbl">Black</div><div class="hex">#000000 · footer</div></div>
</div>
<div class="swatch-row">
  <div class="sw"><div class="chip" style="background:#FFFFFF;border:1px solid #D1D1D1"></div><div class="lbl">White</div><div class="hex">#FFFFFF · cards</div></div>
  <div class="sw"><div class="chip" style="background:#F5F5F5"></div><div class="lbl">Light gray</div><div class="hex">#F5F5F5 · surfaces</div></div>
  <div class="sw"><div class="chip" style="background:#F1ECEE"></div><div class="lbl">Media bg</div><div class="hex">#F1ECEE · product imgs</div></div>
  <div class="sw"><div class="chip" style="background:#D1D1D1"></div><div class="lbl">Dimmed</div><div class="hex">#D1D1D1 · borders</div></div>
  <div class="sw"><div class="chip" style="background:#8D8D8D"></div><div class="lbl">Decimal</div><div class="hex">#8D8D8D · price decimals</div></div>
</div>
</body></html>
