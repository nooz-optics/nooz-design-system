<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#FCFAFA;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .cat{display:flex;flex-direction:column;gap:6px}
  .dot{width:100%;aspect-ratio:1.8/1;border-radius:0}
  .label{font-size:11px;font-weight:500;color:#2D2D2D}
  .hex{font-size:10px;color:#8D8D8D;font-variant-numeric:tabular-nums}
</style></head>
<body>
<div class="cat"><div class="dot" style="background:#FEAE00"></div><div class="label">Sun</div><div class="hex">#FEAE00</div></div>
<div class="cat"><div class="dot" style="background:#731520"></div><div class="label">Reading</div><div class="hex">#731520</div></div>
<div class="cat"><div class="dot" style="background:#1C5FAB"></div><div class="label">Bluelight</div><div class="hex">#1C5FAB</div></div>
<div class="cat"><div class="dot" style="background:#FC6806"></div><div class="label">Kids</div><div class="hex">#FC6806</div></div>
<div class="cat"><div class="dot" style="background:#61B232"></div><div class="label">Sport</div><div class="hex">#61B232</div></div>
<div class="cat"><div class="dot" style="background:#EF233C"></div><div class="label">Original</div><div class="hex">#EF233C</div></div>
<div class="cat"><div class="dot" style="background:#194733"></div><div class="label">Club House</div><div class="hex">#194733</div></div>
<div class="cat"><div class="dot" style="background:#B0A089"></div><div class="label">Reading-sun</div><div class="hex">#B0A089</div></div>
<div class="cat"><div class="dot" style="background:#4D6E41"></div><div class="label">Reading-degressive</div><div class="hex">#4D6E41</div></div>
<div class="cat"><div class="dot" style="background:#143963"></div><div class="label">Reading-bluelight</div><div class="hex">#143963</div></div>
</body></html>
