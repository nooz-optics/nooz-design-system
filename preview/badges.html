<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;padding:26px;background:#FCFAFA;font-family:'Mont',sans-serif;display:flex;gap:14px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:500;color:#fff}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff;opacity:0.9}
  .ghost{background:#fff;color:#2D2D2D;border:1px solid #D1D1D1}
</style></head><body>
<span class="pill" style="background:#DC693B"><span class="dot"></span>NEW</span>
<span class="pill" style="background:#EF233C">ORIGINAL</span>
<span class="pill" style="background:#FEAE00;color:#2D2D2D"><span class="dot" style="background:#2D2D2D"></span>SUN</span>
<span class="pill" style="background:#1C5FAB">BLUELIGHT</span>
<span class="pill" style="background:#731520">READING</span>
<span class="pill" style="background:#61B232">SPORT</span>
<span class="pill" style="background:#FC6806">KIDS</span>
<span class="pill ghost">Pre-order</span>
<span class="pill ghost">In stock</span>
<span class="pill" style="background:#194733">CLUB HOUSE SS26</span>
</body></html>
