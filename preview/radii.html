<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;padding:24px;background:#FCFAFA;font-family:'Mont',sans-serif;display:flex;gap:14px;align-items:stretch}
  .r{flex:1;display:flex;flex-direction:column;gap:6px}
  .box{aspect-ratio:2/1;background:#fff;box-shadow:0 0 10px rgba(0,0,0,0.05);display:flex;align-items:center;justify-content:center;color:#2D2D2D;font-size:12px;font-weight:500}
  .l{font-size:10px;color:#8D8D8D}
</style></head><body>
<div class="r"><div class="box" style="border-radius:0">0px</div><div class="l">default · everything</div></div>
<div class="r"><div class="box" style="border-radius:8px">8px</div><div class="l">pickers · modals</div></div>
<div class="r"><div class="box" style="border-radius:14px">14px</div><div class="l">selection cards</div></div>
<div class="r"><div class="box" style="border-radius:20px">20px</div><div class="l">clear/review cards</div></div>
<div class="r"><div class="box" style="border-radius:100px">pill</div><div class="l">badges · cart count</div></div>
</body></html>
